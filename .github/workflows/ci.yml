# RapidSegment CI
# Purpose: automated safety net that runs on every push/PR. It proves the locked
# dependencies install (`uv sync --all-extras`) and the test suite passes
# (`uv run pytest`) on both supported Pythons (3.11, 3.12), including the
# ui/excel/gcp/prettytable extras. A green CI means an upgrade/build is safe to merge.
# How to use: it runs automatically on push/PR. To run manually, go to the repo's
# Actions tab -> CI -> "Run workflow" (enabled by `workflow_dispatch` below).
# Note: we intentionally do NOT run a `--resolution lowest` job — optbinning
# declares matplotlib/pandas/scikit-learn/ropwr with no lower bound, so lowest
# resolution pulls ancient releases that fail to build on Python 3.11.

name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Test (locked versions)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
          activate-environment: false
      - name: Sync dependencies (core + dev + extras)
        working-directory: rapidsegment
        run: uv sync --all-extras
      - name: Run smoke tests
        working-directory: rapidsegment
        run: uv run pytest
