<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RapidSegment — Interactive Segment Generation Walkthrough</title>
  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone@7.26.5/babel.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0a0f0d;
      --bg-2: #0f1814;
      --panel: rgba(15, 28, 22, 0.92);
      --border: rgba(52, 211, 153, 0.22);
      --border-strong: rgba(52, 211, 153, 0.45);
      --emerald: #34d399;
      --emerald-dim: #6ee7b7;
      --emerald-glow: rgba(52, 211, 153, 0.35);
      --amber: #fbbf24;
      --rose: #fb7185;
      --sky: #38bdf8;
      --text: #e7fef3;
      --muted: #8fb9a6;
      --danger: #f87171;
      --mono: "JetBrains Mono", ui-monospace, monospace;
      --sans: "Space Grotesk", system-ui, sans-serif;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: var(--sans); min-height: 100%; }
    body {
      background-image:
        linear-gradient(rgba(52, 211, 153, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(52, 211, 153, 0.03) 1px, transparent 1px);
      background-size: 32px 32px;
    }
    body::before {
      content: "";
      position: fixed; inset: 0; pointer-events: none; z-index: 0;
      background: radial-gradient(ellipse 80% 50% at 50% -20%, rgba(52, 211, 153, 0.12), transparent);
    }
    #root { position: relative; z-index: 1; min-height: 100vh; }

    .app { max-width: 1180px; margin: 0 auto; padding: 28px 20px 80px; }

    header.hero {
      display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-end;
      justify-content: space-between; margin-bottom: 28px;
      border-bottom: 1px solid var(--border); padding-bottom: 20px;
    }
    .badge {
      display: inline-flex; align-items: center; gap: 8px;
      font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em;
      text-transform: uppercase; color: var(--emerald);
      border: 1px solid var(--border-strong); background: rgba(52,211,153,0.08);
      padding: 6px 10px; border-radius: 999px;
    }
    .badge .dot {
      width: 7px; height: 7px; border-radius: 50%; background: var(--emerald);
      box-shadow: 0 0 10px var(--emerald); animation: pulse 1.8s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }
    h1 {
      margin: 10px 0 6px; font-size: clamp(1.5rem, 3vw, 2rem); font-weight: 700;
      letter-spacing: -0.02em;
    }
    .subtitle { color: var(--muted); margin: 0; max-width: 560px; line-height: 1.5; font-size: 0.95rem; }

    .layout {
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 20px;
    }
    @media (max-width: 900px) {
      .layout { grid-template-columns: 1fr; }
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      backdrop-filter: blur(8px);
      box-shadow: 0 0 0 1px rgba(0,0,0,0.2), 0 20px 50px rgba(0,0,0,0.35);
    }

    .sidebar { padding: 16px; position: sticky; top: 16px; align-self: start; }
    .sidebar h2 {
      margin: 0 0 12px; font-size: 12px; letter-spacing: 0.12em;
      text-transform: uppercase; color: var(--muted); font-family: var(--mono);
    }
    .step-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
    .step-item {
      display: flex; gap: 10px; align-items: flex-start;
      padding: 10px 10px; border-radius: 10px; border: 1px solid transparent;
      cursor: pointer; transition: 0.15s ease; text-align: left; width: 100%;
      background: transparent; color: inherit; font: inherit;
    }
    .step-item:hover:not(:disabled) { border-color: var(--border); background: rgba(52,211,153,0.05); }
    .step-item.active {
      border-color: var(--border-strong);
      background: rgba(52,211,153,0.1);
      box-shadow: inset 0 0 20px rgba(52,211,153,0.06);
    }
    .step-item.done .step-num { background: var(--emerald); color: #062016; }
    .step-item:disabled { opacity: 0.4; cursor: not-allowed; }
    .step-num {
      flex-shrink: 0; width: 24px; height: 24px; border-radius: 8px;
      display: grid; place-items: center;
      font-family: var(--mono); font-size: 11px; font-weight: 600;
      background: rgba(255,255,255,0.06); color: var(--muted);
    }
    .step-item.active .step-num { background: var(--emerald); color: #062016; }
    .step-label { font-size: 13px; font-weight: 500; line-height: 1.3; }
    .step-hint { font-size: 11px; color: var(--muted); margin-top: 2px; font-family: var(--mono); }

    .main { padding: 0; overflow: hidden; }
    .main-header {
      padding: 18px 22px; border-bottom: 1px solid var(--border);
      display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between;
    }
    .main-header h2 { margin: 0; font-size: 1.15rem; }
    .main-body { padding: 22px; }

    .btn {
      font-family: var(--mono); font-size: 12px; font-weight: 600;
      border-radius: 10px; border: 1px solid var(--border-strong);
      background: rgba(52,211,153,0.12); color: var(--emerald-dim);
      padding: 10px 16px; cursor: pointer; transition: 0.15s ease;
      letter-spacing: 0.02em;
    }
    .btn:hover:not(:disabled) {
      background: rgba(52,211,153,0.22);
      box-shadow: 0 0 24px var(--emerald-glow);
    }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn.primary {
      background: linear-gradient(135deg, #34d399, #10b981);
      color: #062016; border-color: transparent;
    }
    .btn.primary:hover:not(:disabled) {
      filter: brightness(1.08);
      box-shadow: 0 0 28px var(--emerald-glow);
    }
    .btn.ghost { background: transparent; }
    .btn-row { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 18px; }

    .kpi-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 10px; margin-bottom: 18px;
    }
    .kpi {
      border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px;
      background: rgba(0,0,0,0.25);
    }
    .kpi .label { font-family: var(--mono); font-size: 10px; color: var(--muted); letter-spacing: 0.08em; text-transform: uppercase; }
    .kpi .value { font-size: 1.35rem; font-weight: 700; margin-top: 4px; color: var(--emerald-dim); font-variant-numeric: tabular-nums; }
    .kpi .value.amber { color: var(--amber); }
    .kpi .value.sky { color: var(--sky); }
    .kpi .value.rose { color: var(--rose); }

    .callout {
      border-left: 3px solid var(--emerald);
      background: rgba(52,211,153,0.06);
      padding: 12px 14px; border-radius: 0 10px 10px 0;
      margin: 14px 0; font-size: 0.92rem; line-height: 1.55; color: var(--emerald-dim);
    }
    .callout.warn { border-left-color: var(--amber); background: rgba(251,191,36,0.08); color: #fde68a; }
    .callout.info { border-left-color: var(--sky); background: rgba(56,189,248,0.08); color: #bae6fd; }

    .table-wrap { overflow: auto; border: 1px solid var(--border); border-radius: 12px; margin: 12px 0; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
    th, td { padding: 9px 12px; text-align: left; border-bottom: 1px solid rgba(52,211,153,0.1); }
    th {
      font-family: var(--mono); font-size: 10px; letter-spacing: 0.08em;
      text-transform: uppercase; color: var(--muted); background: rgba(0,0,0,0.35);
      position: sticky; top: 0;
    }
    tr:last-child td { border-bottom: none; }
    tr.highlight td { background: rgba(52,211,153,0.12); }
    tr.excluded td { opacity: 0.35; text-decoration: line-through; }
    tr.fade-in { animation: rowIn 0.45s ease both; }
    @keyframes rowIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: none; }
    }

    .chip {
      display: inline-flex; align-items: center; gap: 4px;
      font-family: var(--mono); font-size: 11px;
      padding: 3px 8px; border-radius: 999px;
      border: 1px solid var(--border); background: rgba(0,0,0,0.3);
    }
    .chip.green { color: var(--emerald); border-color: rgba(52,211,153,0.4); }
    .chip.amber { color: var(--amber); border-color: rgba(251,191,36,0.4); }
    .chip.rose { color: var(--rose); border-color: rgba(251,113,133,0.4); }
    .chip.sky { color: var(--sky); border-color: rgba(56,189,248,0.4); }

    .progress-track {
      height: 6px; border-radius: 999px; background: rgba(255,255,255,0.06);
      overflow: hidden; margin: 10px 0 4px;
    }
    .progress-fill {
      height: 100%; border-radius: 999px;
      background: linear-gradient(90deg, #059669, #34d399);
      transition: width 0.4s ease;
      box-shadow: 0 0 12px var(--emerald-glow);
    }

    .bin-bars { display: flex; flex-direction: column; gap: 8px; margin: 12px 0; }
    .bin-row { display: grid; grid-template-columns: 110px 1fr 48px; gap: 10px; align-items: center; }
    .bin-row .name { font-family: var(--mono); font-size: 11px; color: var(--muted); }
    .bin-bar-bg { height: 10px; border-radius: 6px; background: rgba(255,255,255,0.06); overflow: hidden; }
    .bin-bar {
      height: 100%; border-radius: 6px;
      background: linear-gradient(90deg, #0d9488, #34d399);
      transition: width 0.6s cubic-bezier(.2,.8,.2,1);
    }
    .bin-row .pct { font-family: var(--mono); font-size: 11px; color: var(--emerald-dim); text-align: right; }

    .candidate-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 10px; margin: 12px 0;
    }
    .candidate {
      border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px;
      background: rgba(0,0,0,0.25); transition: 0.2s ease; position: relative;
    }
    .candidate.winner {
      border-color: var(--emerald);
      box-shadow: 0 0 0 1px var(--emerald), 0 0 28px var(--emerald-glow);
      background: rgba(52,211,153,0.1);
    }
    .candidate.rejected { opacity: 0.45; }
    .candidate .tag {
      position: absolute; top: 10px; right: 10px;
      font-family: var(--mono); font-size: 10px; letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    .candidate h4 { margin: 0 0 8px; font-size: 13px; font-family: var(--mono); color: var(--emerald-dim); padding-right: 70px; }
    .candidate .meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }

    .sql-block {
      font-family: var(--mono); font-size: 12px; line-height: 1.55;
      background: #050a08; border: 1px solid var(--border); border-radius: 10px;
      padding: 12px 14px; overflow: auto; color: #a7f3d0; margin: 10px 0;
      white-space: pre-wrap;
    }
    .sql-block .kw { color: #38bdf8; }
    .sql-block .str { color: #fbbf24; }
    .sql-block .cm { color: #64748b; }

    .pipeline {
      display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 14px 0;
    }
    .pipe-node {
      font-family: var(--mono); font-size: 11px; padding: 8px 12px; border-radius: 8px;
      border: 1px solid var(--border); background: rgba(0,0,0,0.3);
    }
    .pipe-node.on {
      border-color: var(--emerald); background: rgba(52,211,153,0.15); color: var(--emerald-dim);
      box-shadow: 0 0 16px var(--emerald-glow);
    }
    .pipe-arrow { color: var(--muted); font-family: var(--mono); }

    .anim-dots::after {
      content: "";
      animation: dots 1.2s steps(4, end) infinite;
    }
    @keyframes dots {
      0% { content: ""; }
      25% { content: "."; }
      50% { content: ".."; }
      75% { content: "..."; }
    }

    .row-pool {
      display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0;
      min-height: 48px;
    }
    .row-pill {
      width: 28px; height: 28px; border-radius: 8px;
      display: grid; place-items: center;
      font-family: var(--mono); font-size: 10px; font-weight: 600;
      border: 1px solid var(--border);
      background: rgba(52,211,153,0.12); color: var(--emerald-dim);
      transition: 0.35s ease;
    }
    .row-pill.out {
      background: rgba(248,113,113,0.12);
      border-color: rgba(248,113,113,0.35);
      color: var(--rose);
      transform: scale(0.85);
      opacity: 0.5;
    }
    .row-pill.event {
      box-shadow: inset 0 0 0 2px var(--amber);
    }

    .footer-note {
      margin-top: 20px; font-size: 12px; color: var(--muted); font-family: var(--mono);
      border-top: 1px solid var(--border); padding-top: 14px;
    }

    .phase-title {
      display: flex; align-items: center; gap: 10px; margin-bottom: 6px;
    }
    .phase-title .idx {
      font-family: var(--mono); font-size: 11px; color: #062016;
      background: var(--emerald); padding: 3px 8px; border-radius: 6px; font-weight: 700;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo, useRef } = React;

// ---------- Demo dataset (12 rows, educational scale) ----------
const RAW_ROWS = [
  { id: 1,  age: 22, income: 28, risk: "low",  util: 0.12, default: 0 },
  { id: 2,  age: 25, income: 32, risk: "low",  util: 0.18, default: 0 },
  { id: 3,  age: 29, income: 41, risk: "med",  util: 0.45, default: 1 },
  { id: 4,  age: 31, income: 38, risk: "med",  util: 0.52, default: 0 },
  { id: 5,  age: 34, income: 55, risk: "high", util: 0.71, default: 1 },
  { id: 6,  age: 36, income: 48, risk: "med",  util: 0.38, default: 0 },
  { id: 7,  age: 41, income: 62, risk: "high", util: 0.80, default: 1 },
  { id: 8,  age: 44, income: 58, risk: "high", util: 0.66, default: 1 },
  { id: 9,  age: 48, income: 72, risk: "low",  util: 0.22, default: 1 },
  { id: 10, age: 52, income: 68, risk: "med",  util: 0.49, default: 0 },
  { id: 11, age: 27, income: 30, risk: "high", util: 0.75, default: 1 },
  { id: 12, age: 39, income: 51, risk: "low",  util: 0.15, default: 0 },
];

const STEPS = [
  { id: "load", title: "Load data", hint: "Bring rows into workspace" },
  { id: "baserate", title: "Residual base rate", hint: "Size, events, rate" },
  { id: "iv", title: "Rank features", hint: "Which columns matter" },
  { id: "binning", title: "Bin the data", hint: "Turn numbers into groups" },
  { id: "apriori", title: "Build candidates", hint: "1-way, 2-way, 3-way rules" },
  { id: "select", title: "Pick the champion", hint: "Filter + rank candidates" },
  { id: "reduce", title: "Shrink the residual", hint: "Remove matched rows" },
  { id: "repeat", title: "Next segment", hint: "Repeat on what’s left" },
  { id: "done", title: "Final segments", hint: "Ordered exclusive rules" },
];

// Approximate IV-style ranking for demo (precomputed narrative values)
const FEATURE_IV = [
  { feature: "util", iv: 0.42, rank: 1, note: "Strong separation on default" },
  { feature: "risk", iv: 0.31, rank: 2, note: "Categorical high risk lifts events" },
  { feature: "age", iv: 0.18, rank: 3, note: "Moderate monotonic signal" },
  { feature: "income", iv: 0.09, rank: 4, note: "Weaker; skipped for combinations" },
];

const BINS = {
  util: [
    { label: "util ≤ 0.25", ids: [1, 2, 9, 12], events: 1, n: 4, rate: 0.25 },
    { label: "0.25 < util ≤ 0.55", ids: [3, 4, 6, 10], events: 1, n: 4, rate: 0.25 },
    { label: "util > 0.55", ids: [5, 7, 8, 11], events: 4, n: 4, rate: 1.0 },
  ],
  risk: [
    { label: "risk = low", ids: [1, 2, 9, 12], events: 1, n: 4, rate: 0.25 },
    { label: "risk = med", ids: [3, 4, 6, 10], events: 1, n: 4, rate: 0.25 },
    { label: "risk = high", ids: [5, 7, 8, 11], events: 4, n: 4, rate: 1.0 },
  ],
  age: [
    { label: "age ≤ 30", ids: [1, 2, 11], events: 1, n: 3, rate: 0.33 },
    { label: "30 < age ≤ 40", ids: [3, 4, 5, 6, 12], events: 2, n: 5, rate: 0.4 },
    { label: "age > 40", ids: [7, 8, 9, 10], events: 3, n: 4, rate: 0.75 },
  ],
};

// Progressive candidates with distinct KPIs so rate → lift → size has one clear winner
const CANDIDATES_1WAY = [
  { id: "1a", rule: "util > 0.55", way: "1-way", n: 4, events: 4, rate: 1.0, lift: 2.0, ok: true },
  { id: "1b", rule: "risk = high", way: "1-way", n: 4, events: 3, rate: 0.85, lift: 1.7, ok: true },
  { id: "1c", rule: "age > 40", way: "1-way", n: 4, events: 3, rate: 0.75, lift: 1.5, ok: true },
];
const CANDIDATES_2WAY = [
  { id: "2a", rule: "util > 0.55 AND risk = high", way: "2-way", n: 3, events: 3, rate: 1.0, lift: 2.0, ok: true },
  { id: "2b", rule: "util > 0.55 AND age > 40", way: "2-way", n: 2, events: 2, rate: 1.0, lift: 2.0, ok: true },
  { id: "2c", rule: "risk = high AND age > 40", way: "2-way", n: 3, events: 2, rate: 0.67, lift: 1.3, ok: false, reason: "lift too low" },
  { id: "2d", rule: "util > 0.55 AND age ≤ 30", way: "2-way", n: 1, events: 1, rate: 1.0, lift: 2.0, ok: false, reason: "too few rows" },
  { id: "2e", rule: "risk = high AND age ≤ 30", way: "2-way", n: 1, events: 1, rate: 1.0, lift: 2.0, ok: false, reason: "too few rows" },
  { id: "2f", rule: "age > 40 AND util ≤ 0.25", way: "2-way", n: 2, events: 0, rate: 0, lift: 0, ok: false, reason: "lift too low" },
];
const CANDIDATES_3WAY = [
  { id: "3a", rule: "util > 0.55 AND risk = high AND age > 40", way: "3-way", n: 2, events: 1, rate: 0.5, lift: 1.0, ok: false, reason: "lift too low" },
  { id: "3b", rule: "util > 0.55 AND risk = high AND age > 30", way: "3-way", n: 2, events: 2, rate: 0.9, lift: 1.8, ok: true },
];
const CANDIDATES_ALL = [...CANDIDATES_1WAY, ...CANDIDATES_2WAY, ...CANDIDATES_3WAY];
function rankKey(c) {
  return [c.rate, c.lift, c.n];
}
function cmpRank(a, b) {
  const ka = rankKey(a);
  const kb = rankKey(b);
  for (let i = 0; i < 3; i++) {
    if (kb[i] !== ka[i]) return kb[i] - ka[i];
  }
  return 0;
}
const CANDIDATES_PASSED = CANDIDATES_ALL.filter((c) => c.ok).slice().sort(cmpRank);
const CHAMPION = CANDIDATES_PASSED[0];
const CANDIDATES = CANDIDATES_PASSED.map((c, i) => ({ ...c, winner: i === 0 }));

const SEGMENTS = [
  {
    id: 1,
    rule: "util > 0.55",
    way: "1-way",
    sql: 'WHERE "util" > 0.55',
    n: 4,
    events: 4,
    rate: 1.0,
    lift: 2.0,
    excludedIds: [5, 7, 8, 11],
  },
  {
    id: 2,
    rule: "risk = med AND age < 35",
    way: "2-way",
    sql: 'WHERE "risk" = \'med\' AND "age" < 35',
    n: 2,
    events: 1,
    rate: 0.5,
    lift: 2.0,
    excludedIds: [3, 4],
  },
  {
    id: 3,
    rule: "age ≥ 39 AND risk = low",
    way: "2-way",
    sql: 'WHERE "age" >= 39 AND "risk" = \'low\'',
    n: 2,
    events: 1,
    rate: 0.5,
    lift: 2.0,
    excludedIds: [9, 12],
  },
];

function sleep(ms) {
  return new Promise((r) => setTimeout(r, ms));
}

function App() {
  const [unlocked, setUnlocked] = useState(0); // highest step index unlocked
  const [active, setActive] = useState(0);
  const [loading, setLoading] = useState(false);
  const [loadedRows, setLoadedRows] = useState([]);
  const [excluded, setExcluded] = useState(new Set());
  const [segPhase, setSegPhase] = useState(0); // for reduce/repeat animation
  const [autoPlay, setAutoPlay] = useState(false);

  const residualRows = useMemo(
    () => RAW_ROWS.filter((r) => !excluded.has(r.id)),
    [excluded]
  );

  const baseRate = useMemo(() => {
    const n = residualRows.length || 1;
    const events = residualRows.filter((r) => r.default === 1).length;
    return { n, events, rate: events / n };
  }, [residualRows]);

  async function handleLoadData() {
    if (loading) return;
    setLoading(true);
    setLoadedRows([]);
    setExcluded(new Set());
    setSegPhase(0);
    for (let i = 0; i < RAW_ROWS.length; i++) {
      await sleep(90);
      setLoadedRows((prev) => [...prev, RAW_ROWS[i]]);
    }
    setLoading(false);
    setUnlocked((u) => Math.max(u, 0)); // stay on step 1; user advances with Next
  }

  function goTo(i) {
    if (i <= unlocked) setActive(i);
  }

  function advance() {
    const next = Math.min(active + 1, STEPS.length - 1);
    setUnlocked((u) => Math.max(u, next));
    setActive(next);
  }

  // When entering residual update step, animate exclusion for segment 1
  useEffect(() => {
    if (STEPS[active].id === "reduce" && segPhase === 0) {
      const t = setTimeout(() => {
        setExcluded(new Set(SEGMENTS[0].excludedIds));
        setSegPhase(1);
      }, 600);
      return () => clearTimeout(t);
    }
  }, [active, segPhase]);

  // Entering "repeat": start from segment 1 claimed; user advances with button
  useEffect(() => {
    if (STEPS[active].id !== "repeat") return;
    setExcluded(new Set(SEGMENTS[0].excludedIds));
    setSegPhase(1);
  }, [active]);

  useEffect(() => {
    if (STEPS[active].id === "done") {
      const all = new Set([
        ...SEGMENTS[0].excludedIds,
        ...SEGMENTS[1].excludedIds,
        ...SEGMENTS[2].excludedIds,
      ]);
      setExcluded(all);
      setSegPhase(3);
    }
  }, [active]);

  function claimNextSegment() {
    if (segPhase >= 3) return;
    const next = segPhase + 1;
    const ids = [];
    for (let i = 0; i < next; i++) {
      ids.push(...SEGMENTS[i].excludedIds);
    }
    setExcluded(new Set(ids));
    setSegPhase(next);
  }

  function restartWalkthrough() {
    setActive(0);
    setUnlocked(0);
    setLoadedRows([]);
    setExcluded(new Set());
    setSegPhase(0);
    setLoading(false);
    setAutoPlay(false);
  }

  useEffect(() => {
    if (!autoPlay) return;
    if (active >= STEPS.length - 1) {
      setAutoPlay(false);
      return;
    }
    const t = setTimeout(() => {
      if (active === 0 && loadedRows.length < RAW_ROWS.length) {
        handleLoadData();
      } else {
        advance();
      }
    }, active === 0 ? 1800 : 2200);
    return () => clearTimeout(t);
  }, [autoPlay, active, loadedRows.length]);

  const step = STEPS[active];

  return (
    <div className="app">
      <header className="hero">
        <div>
          <div className="badge"><span className="dot" /> RapidSegment · Engine Walkthrough</div>
          <h1>How segments are generated</h1>
          <p className="subtitle">
            A simple walkthrough of the core idea: load data, rank features, bin values, search
            1-way / 2-way / 3-way rules, pick one champion, remove those people, repeat on what is left.
          </p>
        </div>
        <div className="btn-row" style={{ marginTop: 0 }}>
          <button className="btn primary" onClick={handleLoadData} disabled={loading}>
            {loading ? <span className="anim-dots">Loading rows</span> : "Load data"}
          </button>
          <button
            className="btn"
            onClick={() => setAutoPlay((v) => !v)}
            disabled={loading}
          >
            {autoPlay ? "Pause auto-play" : "Auto-play walkthrough"}
          </button>
        </div>
      </header>

      <div className="layout">
        <aside className="panel sidebar">
          <h2>Pipeline</h2>
          <ol className="step-list">
            {STEPS.map((s, i) => (
              <li key={s.id}>
                <button
                  className={
                    "step-item" +
                    (i === active ? " active" : "") +
                    (i < unlocked || i === active ? " done" : "")
                  }
                  disabled={i > unlocked}
                  onClick={() => goTo(i)}
                >
                  <span className="step-num">{i + 1}</span>
                  <span>
                    <div className="step-label">{s.title}</div>
                    <div className="step-hint">{s.hint}</div>
                  </span>
                </button>
              </li>
            ))}
          </ol>
          <div className="footer-note">
            Progress {Math.min(unlocked + (loadedRows.length ? 1 : 0), STEPS.length)}/{STEPS.length}
            <div className="progress-track">
              <div
                className="progress-fill"
                style={{ width: `${(active / (STEPS.length - 1)) * 100}%` }}
              />
            </div>
          </div>
        </aside>

        <main className="panel main">
          <div className="main-header">
            <div className="phase-title">
              <span className="idx">STEP {active + 1}</span>
              <h2>{step.title}</h2>
            </div>
            <div className="btn-row" style={{ marginTop: 0 }}>
              <button className="btn ghost" disabled={active === 0} onClick={() => goTo(active - 1)}>
                ← Back
              </button>
              <button
                className="btn primary"
                disabled={active === 0 && loadedRows.length === 0}
                onClick={() => {
                  if (active === STEPS.length - 1) {
                    restartWalkthrough();
                    return;
                  }
                  if (active === 0 && loadedRows.length < RAW_ROWS.length) handleLoadData();
                  else advance();
                }}
              >
                {active === STEPS.length - 1 ? "Start over" : "Next →"}
              </button>
            </div>
          </div>
          <div className="main-body">
            {active === 0 && <StepLoad rows={loadedRows} loading={loading} total={RAW_ROWS.length} />}
            {active === 1 && <StepBaseRate baseRate={baseRate} rows={residualRows} />}
            {active === 2 && <StepIV />}
            {active === 3 && <StepBinning />}
            {active === 4 && <StepApriori />}
            {active === 5 && <StepSelect />}
            {active === 6 && <StepReduce rows={RAW_ROWS} excluded={excluded} segment={SEGMENTS[0]} />}
            {active === 7 && (
              <StepRepeat
                baseRate={baseRate}
                excluded={excluded}
                segPhase={segPhase}
                onClaimNext={claimNextSegment}
              />
            )}
            {active === 8 && <StepDone />}
          </div>
        </main>
      </div>
    </div>
  );
}

function StepLoad({ rows, loading, total }) {

    <>
      <p>
        RapidSegment accepts a frame, a file path, or a DuckDB path. For large files,{" "}
        <strong>path-based ingest</strong> streams into DuckDB without holding the full table in Python RAM.
      </p>
      <div className="callout info">
        Demo loads <strong>{total} customers</strong> with features <span className="chip">age</span>{" "}
        <span className="chip">income</span> <span className="chip">risk</span>{" "}
        <span className="chip">util</span> and binary target <span className="chip rose">default</span>.
      </div>
      <div className="kpi-grid">
        <div className="kpi"><div className="label">Rows loaded</div><div className="value">{rows.length}/{total}</div></div>
        <div className="kpi"><div className="label">Events</div><div className="value amber">{rows.filter(r=>r.default===1).length}</div></div>
        <div className="kpi"><div className="label">Status</div><div className="value sky">{loading ? "streaming" : rows.length ? "ready" : "waiting"}</div></div>
      </div>
      <div className="table-wrap">
        <table>
          <thead>
            <tr>
              <th>id</th><th>age</th><th>income</th><th>risk</th><th>util</th><th>default</th>
            </tr>
          </thead>
          <tbody>
            {rows.map((r) => (
              <tr key={r.id} className="fade-in">
                <td>{r.id}</td>
                <td>{r.age}</td>
                <td>{r.income}</td>
                <td><span className={"chip " + (r.risk === "high" ? "rose" : r.risk === "med" ? "amber" : "green")}>{r.risk}</span></td>
                <td>{r.util.toFixed(2)}</td>
                <td>{r.default === 1 ? <span className="chip rose">1</span> : <span className="chip">0</span>}</td>

}

function StepBaseRate({ baseRate, rows }) {
  return (
    <>
      <p>
        Before searching for rules, measure the residual: how many people, how many events, and the
        average event rate. <strong>Lift</strong> later means “how much better is this rule than that average?”
      </p>
      <div className="kpi-grid">
        <div className="kpi"><div className="label">Residual rows</div><div className="value">{baseRate.n}</div></div>
        <div className="kpi"><div className="label">Events</div><div className="value amber">{baseRate.events}</div></div>
        <div className="kpi"><div className="label">Base rate</div><div className="value rose">{(baseRate.rate * 100).toFixed(1)}%</div></div>
      </div>
      <div className="callout warn">
        Here: {baseRate.events} events / {baseRate.n} rows ≈ <strong>{(baseRate.rate * 100).toFixed(1)}%</strong> base rate.
        A group with 100% events would be about <strong>{(1 / baseRate.rate).toFixed(1)}×</strong> the base rate (lift).
      </div>
      <div className="row-pool">
        {rows.map((r) => (
          <div key={r.id} className={"row-pill" + (r.default ? " event" : "")} title={`id ${r.id}`}>
            {r.id}
          </div>
        ))}
      </div>
      <p style={{ fontSize: 12, color: "var(--muted)" }}>
        Amber ring = event. This is the pool we search over for the next segment.
      </p>
    </>
  );
}

function StepIV() {
  return (
    <>
      <p>
        Not every column is equally useful. We rank features by how well they separate events from
        non-events (here: <strong>Information Value</strong>). Only the strongest few are used to
        build multi-feature rules — otherwise combinations explode.
      </p>
      <div className="table-wrap">
        <table>
          <thead>
            <tr><th>Rank</th><th>Feature</th><th>Strength</th><th>Note</th></tr>
          </thead>
          <tbody>
            {FEATURE_IV.map((f) => (
              <tr key={f.feature} className={f.rank <= 3 ? "highlight" : ""}>
                <td>{f.rank}</td>
                <td><span className="chip green">{f.feature}</span></td>
                <td>{f.iv.toFixed(2)}</td>
                <td>{f.note}</td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
      <div className="callout">
        In this demo we keep the top <strong>3</strong>: util, risk, age.{" "}
        <strong>income</strong> is weaker, so we skip it when building 2-way and 3-way combinations.
      </div>
      <div className="bin-bars">
        {FEATURE_IV.map((f) => (
          <div className="bin-row" key={f.feature}>
            <div className="name">{f.feature}</div>
            <div className="bin-bar-bg"><div className="bin-bar" style={{ width: `${(f.iv / 0.45) * 100}%` }} /></div>
            <div className="pct">{f.iv.toFixed(2)}</div>
          </div>
        ))}
      </div>
    </>
  );
}

function StepBinning() {
  return (
    <>
      <p>
        Continuous values (like util or age) are cut into a few <strong>bins</strong> — clear groups such as
        “low / mid / high.” Categories (like risk) already are groups. Rules are built from these groups,
        not from raw continuous thresholds chosen by hand.
      </p>
      <div className="pipeline">
        <span className="pipe-node on">raw features</span>
        <span className="pipe-arrow">→</span>
        <span className="pipe-node on">learn bin edges</span>
        <span className="pipe-arrow">→</span>
        <span className="pipe-node on">label each row</span>
        <span className="pipe-arrow">→</span>
        <span className="pipe-node on">binned data</span>
      </div>
      <h3 style={{ fontSize: 14, marginTop: 18 }}>util → bins</h3>
      <div className="table-wrap">
        <table>
          <thead>
            <tr><th>Bin</th><th>n</th><th>events</th><th>rate</th><th>row ids</th></tr>
          </thead>
          <tbody>
            {BINS.util.map((b) => (
              <tr key={b.label} className={b.rate === 1 ? "highlight" : ""}>
                <td><span className="chip">{b.label}</span></td>
                <td>{b.n}</td>
                <td>{b.events}</td>
                <td>{(b.rate * 100).toFixed(0)}%</td>
                <td style={{ fontFamily: "var(--mono)", fontSize: 11 }}>{b.ids.join(", ")}</td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
      <h3 style={{ fontSize: 14 }}>risk → bins</h3>
      <div className="table-wrap">
        <table>
          <thead>
            <tr><th>Bin</th><th>n</th><th>events</th><th>rate</th></tr>
          </thead>
          <tbody>
            {BINS.risk.map((b) => (
              <tr key={b.label} className={b.rate === 1 ? "highlight" : ""}>
                <td><span className="chip">{b.label}</span></td>
                <td>{b.n}</td>
                <td>{b.events}</td>
                <td>{(b.rate * 100).toFixed(0)}%</td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
      <h3 style={{ fontSize: 14 }}>age → bins</h3>
      <div className="table-wrap">
        <table>
          <thead>
            <tr><th>Bin</th><th>n</th><th>events</th><th>rate</th><th>row ids</th></tr>
          </thead>
          <tbody>
            {BINS.age.map((b) => (
              <tr key={b.label} className={b.rate >= 0.7 ? "highlight" : ""}>
                <td><span className="chip">{b.label}</span></td>
                <td>{b.n}</td>
                <td>{b.events}</td>
                <td>{(b.rate * 100).toFixed(0)}%</td>
                <td style={{ fontFamily: "var(--mono)", fontSize: 11 }}>{b.ids.join(", ")}</td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
      <div className="callout info">
        Top features each get bins: <span className="chip">util</span>,{" "}
        <span className="chip">risk</span>, <span className="chip">age</span>. Next we combine those
        bins into 1-way, 2-way, and 3-way rules.
      </div>
    </>
  );
}

function CandidateCard({ c, showWinner }) {
  return (
    <div className={"candidate" + (showWinner && c.winner ? " winner" : !c.ok ? " rejected" : "")}>
      <span
        className="tag"
        style={{
          color: showWinner && c.winner ? "var(--emerald)" : !c.ok ? "var(--rose)" : "var(--muted)",
        }}
      >
        {showWinner && c.winner ? "best so far" : !c.ok ? "failed" : "passed"}
      </span>
      <h4>{c.rule}</h4>
      <div>
        <span
          className={
            "chip " + (c.way === "3-way" ? "amber" : c.way === "2-way" ? "sky" : "green")
          }
        >
          {c.way}
        </span>
      </div>
      <div className="meta">
        <span className="chip">n={c.n}</span>
        <span className="chip amber">events={c.events}</span>
        <span className="chip">rate={(c.rate * 100).toFixed(0)}%</span>
        <span className="chip green">lift={c.lift.toFixed(1)}×</span>
      </div>
      {!c.ok && (
        <div style={{ marginTop: 8, fontSize: 12, color: "var(--rose)" }}>Failed: {c.reason}</div>
      )}
    </div>
  );
}

function StepApriori() {
  return (
    <>
      <p>
        From the <strong>util</strong>, <strong>risk</strong>, and <strong>age</strong> bins we build
        rules in layers: first single conditions (1-way), check hard floors, then pair bins (2-way),
        then triples (3-way) only where the pieces still look viable.
      </p>

      <h3 style={{ fontSize: 14, marginTop: 4 }}>1 · One-way rules (each strong bin alone)</h3>
      <div className="candidate-grid">
        {CANDIDATES_1WAY.map((c) => (
          <CandidateCard key={c.id} c={c} />
        ))}
      </div>
      <div className="callout">
        <strong>Hard constraints</strong> (demo floors): min rows ≥ 2, min events ≥ 1, min lift ≥ 1.5×.
        All three 1-ways pass — so we are allowed to combine these bins further.
      </div>

      <h3 style={{ fontSize: 14, marginTop: 18 }}>2 · Two-way rules (AND of two bins)</h3>
      <div className="candidate-grid">
        {CANDIDATES_2WAY.map((c) => (
          <CandidateCard key={c.id} c={c} />
        ))}
      </div>
      <div className="callout warn">
        Some pairs <strong>fail</strong> (too few rows or lift below the floor). Failed pairs are not
        grown into 3-ways — that keeps the search small.
      </div>

      <h3 style={{ fontSize: 14, marginTop: 18 }}>3 · Three-way rules (only a few survive)</h3>
      <div className="candidate-grid">
        {CANDIDATES_3WAY.map((c) => (
          <CandidateCard key={c.id} c={c} />
        ))}
      </div>
      <div className="callout info">
        Because several 2-ways failed, only <strong>1–2</strong> triples are worth checking. Next step:
        rank every <em>passed</em> candidate (1-, 2-, and 3-way) and pick one champion.
      </div>
    </>
  );
}

function StepSelect() {
  const champ = CHAMPION;
  const ranked = CANDIDATES; // already sorted rate → lift → size, winner first
  return (
    <>
      <p>
        Drop candidates that failed the hard floors, then rank every survivor by{" "}
        <strong>rate → lift → size</strong>. The top row is the champion for this residual.
      </p>
      <div className="kpi-grid">
        <div className="kpi"><div className="label">Min rows</div><div className="value">2*</div></div>
        <div className="kpi"><div className="label">Min events</div><div className="value amber">1*</div></div>
        <div className="kpi"><div className="label">Min lift</div><div className="value sky">1.5×</div></div>
      </div>
      <p style={{ fontSize: 12, color: "var(--muted)" }}>
        *Demo thresholds are relaxed for 12 rows. Real runs use much larger minimums.
      </p>
      <div className="callout warn">
        <strong>Champion:</strong> <span className="chip green">{champ.rule}</span>{" "}
        <span className="chip sky">{champ.way}</span>
        <br />
        Clear KPI lead: rate <strong>{(champ.rate * 100).toFixed(0)}%</strong>, lift{" "}
        <strong>{champ.lift.toFixed(1)}×</strong>, n = <strong>{champ.n}</strong>. Every other passed
        rule is worse on rate, or on lift, or on size when rate and lift match.
      </div>
      <div className="table-wrap">
        <table>
          <thead>
            <tr><th>#</th><th>Rule</th><th>way</th><th>rate</th><th>lift</th><th>n</th><th>vs #1</th></tr>
          </thead>
          <tbody>
            {ranked.map((c, i) => (
              <tr key={c.id} className={i === 0 ? "highlight" : ""}>
                <td>{i + 1}</td>
                <td>{c.rule}</td>
                <td>{c.way}</td>
                <td>{(c.rate * 100).toFixed(0)}%</td>
                <td>{c.lift.toFixed(1)}×</td>
                <td>{c.n}</td>
                <td>
                  {i === 0
                    ? "Selected"
                    : c.rate < champ.rate
                    ? "Lower rate"
                    : c.lift < champ.lift
                    ? "Same rate, lower lift"
                    : c.n < champ.n
                    ? "Same rate & lift, smaller n"
                    : "Behind"}
                </td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </>
  );
}

function StepReduce({ rows, excluded, segment }) {
  return (
    <>
      <p>
        Everyone who matches the champion is <strong>removed from the residual</strong>. They keep
        belonging to this segment; the next search only looks at people still unclaimed.
      </p>
      <div className="callout">
        Rule applied: <span className="chip green">{segment.rule}</span> → rows{" "}
        <strong>{segment.excludedIds.join(", ")}</strong> leave the pool.
      </div>
      <div className="kpi-grid">
        <div className="kpi"><div className="label">Segment</div><div className="value">#{segment.id}</div></div>
        <div className="kpi"><div className="label">Claimed now</div><div className="value rose">{excluded.size}</div></div>
        <div className="kpi"><div className="label">Still residual</div><div className="value sky">{rows.length - excluded.size}</div></div>
      </div>
      <div className="row-pool">
        {rows.map((r) => (
          <div
            key={r.id}
            className={
              "row-pill" +
              (excluded.has(r.id) ? " out" : "") +
              (r.default ? " event" : "")
            }
            title={excluded.has(r.id) ? `id ${r.id} claimed by segment ${segment.id}` : `id ${r.id}`}
          >
            {r.id}
          </div>
        ))}
      </div>
      <p style={{ fontSize: 12, color: "var(--muted)" }}>
        Faded pills = claimed by segment 1. Bright pills = still searchable.
      </p>
    </>
  );
}

function StepRepeat({ baseRate, excluded, segPhase, onClaimNext }) {
  const claimedBy = (id) => {
    if (SEGMENTS[0].excludedIds.includes(id)) return 1;
    if (SEGMENTS[1].excludedIds.includes(id)) return 2;
    if (SEGMENTS[2].excludedIds.includes(id)) return 3;
    return 0;
  };
  return (
    <>
      <p>
        On the smaller residual we repeat the same loop: new base rate → rank features → bin →
        build 1/2/3-way candidates → pick champion → claim those rows. Use the button to pull the
        next segment.
      </p>
      <div className="pipeline">
        <span className={"pipe-node" + (segPhase >= 1 ? " on" : "")}>seg 1 claimed</span>
        <span className="pipe-arrow">→</span>
        <span className={"pipe-node" + (segPhase >= 2 ? " on" : "")}>seg 2 · 2-way</span>
        <span className="pipe-arrow">→</span>
        <span className={"pipe-node" + (segPhase >= 3 ? " on" : "")}>seg 3 · 2-way</span>
        <span className="pipe-arrow">→</span>
        <span className={"pipe-node" + (segPhase >= 3 ? " on" : "")}>stop</span>
      </div>
      <div className="kpi-grid">
        <div className="kpi"><div className="label">Claimed so far</div><div className="value rose">{excluded.size}</div></div>
        <div className="kpi"><div className="label">Residual left</div><div className="value">{RAW_ROWS.length - excluded.size}</div></div>
        <div className="kpi"><div className="label">Segments claimed</div><div className="value amber">{segPhase}</div></div>
      </div>

      <div className="btn-row">
        <button
          className="btn primary"
          onClick={onClaimNext}
          disabled={segPhase >= 3}
        >
          {segPhase >= 3 ? "All segments claimed" : `Next segment → (${segPhase + 1})`}
        </button>
      </div>

      {segPhase >= 2 && (
        <div className="callout info">
          <strong>Segment 2:</strong>{" "}
          <span className="chip green">{SEGMENTS[1].rule}</span>{" "}
          <span className="chip sky">2-way</span>
          {" "}· n={SEGMENTS[1].n}, events={SEGMENTS[1].events}, lift={SEGMENTS[1].lift}×
        </div>
      )}
      {segPhase >= 3 && (
        <div className="callout">
          <strong>Segment 3:</strong>{" "}
          <span className="chip green">{SEGMENTS[2].rule}</span>{" "}
          <span className="chip sky">2-way</span>
          {" "}· n={SEGMENTS[2].n}, events={SEGMENTS[2].events}, rate=
          {(SEGMENTS[2].rate * 100).toFixed(0)}%, lift={SEGMENTS[2].lift.toFixed(1)}×
          {" "}on the leftover residual (after seg 1 and 2 removed their matches).
        </div>
      )}

      <div className="row-pool">
        {RAW_ROWS.map((r) => {
          const seg = claimedBy(r.id);
          const isOut = excluded.has(r.id);
          return (
            <div
              key={r.id}
              className={"row-pill" + (isOut ? " out" : "") + (r.default ? " event" : "")}
              title={
                isOut
                  ? `id ${r.id} → segment ${seg}`
                  : `id ${r.id} still residual`
              }
              style={
                isOut && seg
                  ? {
                      outline:
                        seg === 1
                          ? "2px solid #34d399"
                          : seg === 2
                          ? "2px solid #38bdf8"
                          : "2px solid #fbbf24",
                    }
                  : undefined
              }
            >
              {r.id}
            </div>
          );
        })}
      </div>
      <p style={{ fontSize: 12, color: "var(--muted)" }}>
        Outline color: green = seg 1 · blue = seg 2 · amber = seg 3. Faded = claimed.
      </p>
      <div className="callout warn">
        Order matters: earlier segments own their people first. Later segments only see the
        leftover pool — mutual exclusivity by construction.
      </div>
    </>
  );
}

function StepDone() {
  return (
    <>
      <p>
        Result: an <strong>ordered list</strong> of segments. Each person belongs to at most one —
        the first rule that matches in priority order.
      </p>
      <div className="candidate-grid">
        {SEGMENTS.map((s) => (
          <div key={s.id} className="candidate winner">
            <span className="tag" style={{ color: "var(--emerald)" }}>segment {s.id}</span>
            <h4>{s.rule}</h4>
            <div className="meta">
              <span className="chip sky">{s.way}</span>
              <span className="chip">n={s.n}</span>
              <span className="chip amber">events={s.events}</span>
              <span className="chip">rate={(s.rate * 100).toFixed(0)}%</span>
              <span className="chip green">lift={s.lift.toFixed(1)}×</span>
            </div>
          </div>
        ))}
      </div>
      <div className="callout">
        To score the full population, apply the same priority: check segment 1 first, then 2, then 3.
        That keeps “earlier segment = higher in the queue.”
      </div>
      <div className="sql-block">
        <span className="cm">-- Assign each person to at most one segment</span>{"\n"}
        <span className="kw">IF</span> util &gt; 0.55 <span className="kw">→</span> segment 1{"\n"}
        <span className="kw">ELSE IF</span> risk = med <span className="kw">AND</span> age &lt; 35 <span className="kw">→</span> segment 2{"\n"}
        <span className="kw">ELSE IF</span> age ≥ 39 <span className="kw">AND</span> risk = low <span className="kw">→</span> segment 3{"\n"}
        <span className="kw">ELSE</span> → no segment
      </div>
      <div className="footer-note">
        Crux of the algorithm: rank features → bin → search 1/2/3-way candidates → pick one champion →
        remove those rows → repeat on the residual.
      </div>
    </>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
  </script>
</body>
</html>
