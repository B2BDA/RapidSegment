[project]
name = "rapidsegment"
version = "1.2.5"
description = "A fast, multi-segment population scoring and combinatorial heuristic rule extraction engine."
readme = "README.md"
authors = [
    { name = "Bishwarup Biswas", email = "bishwarup1429@gmail.com" }
]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.5.4,<2.0",
    "joblib>=1.5.3,<2.0",
    "numpy>=2.4,<3.0",
    "optbinning>=0.21.0,<1.0",
    "pandas>=2.2.0,<3.0",
    "psutil>=7.2.2,<8.0",
    "pyarrow>=25.0.0,<26.0",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

[project.optional-dependencies]

ui = [
    "streamlit>=1.28,<2.0",
    "plotly>=5.18,<6.0",
]

excel = [
    "openpyxl>=3.1.5,<4.0",
]
gcp = [
    "google-cloud-bigquery>=3.42.2,<4.0",
]
prettytable = [
    "prettytable>=3.18.0,<4.0",
]

[project.scripts]
rapidsegment-ui = "rapidsegment.ui.app:run_ui"

[project.urls]
Homepage = "https://github.com/B2BDA/RapidSegment"
Issues = "https://github.com/B2BDA/RapidSegment/issues"

[build-system]
requires = ["uv_build>=0.12.5,<0.13"]
build-backend = "uv_build"

# Keep the published package to the core library only. `docs/`, `Examples/`,
# `Banner.png`, and `sync_readme.py` stay tracked in git (for contributors) but
# are excluded from both the sdist and the wheel. uv_build does NOT read
# .gitignore, so runtime artifacts under src/ must be excluded explicitly here.
[tool.uv.build-backend]
source-exclude = [
    "docs",
    "Examples",
    "Banner.png",
    "sync_readme.py",
    # Runtime state that must never ship in the package
    ".rapidsegment_suite",
    "experiments",
    "*.duckdb",
    "*.db",
    "*.db.wal",
    "*.parquet",
    "*.json",
    "*.log",
    "__pycache__",
]

[dependency-groups]
# Dev/CI only — not shipped with the package.
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
